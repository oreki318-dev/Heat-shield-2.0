<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(0, 210, 255, 0.3)" stroke-width="6" />

  <!-- Radiating Thermal Glow -->
  <circle cx="256" cy="220" r="110" fill="url(#sunGrad)" opacity="0.35" filter="url(#glow)" />

  <!-- Shield Shape -->
  <path d="M 256 100 L 390 150 L 390 270 C 390 360 256 420 256 420 C 256 420 122 360 122 270 L 122 150 Z" 
        fill="#0a101d" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round" />

  <!-- Thermometer / Flame Center Symbol -->
  <path d="M 256 160 C 242 160 230 172 230 186 L 230 264 C 215 274 206 292 206 312 C 206 340 228 362 256 362 C 284 362 306 340 306 312 C 306 292 297 274 282 264 L 282 186 C 282 172 270 160 256 160 Z" 
        fill="url(#sunGrad)" />

  <circle cx="256" cy="312" r="26" fill="#ffffff" opacity="0.9" />
  <rect x="250" y="200" width="12" height="80" rx="6" fill="#ffffff" opacity="0.9" />
</svg>